source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    grace = 2
    disable_loading_bar = false
}

background {
    monitor =
    path = ~/wallpapers/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = $foreground
    font_size = 90
    font_family = SpaceMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $foreground
    font_size = 22
    font_family = SpaceMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 16
    font_family = SpaceMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $border
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = Enter Password
    hide_input = false
    check_color = $accent
    fail_color = rgb(f38ba8)
    capslock_color = $accent2
    position = 0, -100
    halign = center
    valign = center
    rounding = 16
}