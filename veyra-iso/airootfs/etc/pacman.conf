# Veyra uses Arch packages with the CachyOS repository for its kernel and
# optimized package builds. Keep CachyOS first for shared package names.
[options]
HoldPkg = pacman glibc
Architecture = auto
Color
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
