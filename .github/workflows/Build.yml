name: Build and publish Veyra ISO beta

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-iso:
    name: Build Veyra OS ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    timeout-minutes: 240

    steps:
      - name: Checkout Veyra repo
        uses: actions/checkout@v4

      - name: Checkout dotfiles sibling
        uses: actions/checkout@v4
        with:
          repository: Frank1o3/dotfiles
          path: dotfiles

      - name: Install build dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            archlinux-keyring \
            archiso \
            git \
            rsync \
            sudo \
            pacman-contrib \
            rate-mirrors \
            python3 \
            curl

      - name: Build ISO
        shell: bash
        env:
          DOTFILES_SOURCE: ${{ github.workspace }}/dotfiles
        run: |
          cd "${{ github.workspace }}"
          ./build.sh

      - name: Locate generated ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="$(find "${{ github.workspace }}/out" -type f -name '*.iso' | head -n 1)"
          if [[ -z "${ISO_PATH}" ]]; then
            echo "No ISO found in ${{ github.workspace }}/out" >&2
            exit 1
          fi
          cp "${ISO_PATH}" "${{ github.workspace }}/VeyraOS.x86_64.iso"
          ls -l "${{ github.workspace }}/VeyraOS.x86_64.iso"

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: VeyraOS beta
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/VeyraOS.x86_64.iso
