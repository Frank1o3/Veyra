name: Build and publish Veyra ISO beta

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-iso:
    name: Build Veyra OS ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    permissions:
      contents: write
    timeout-minutes: 240

    env:
      DOTFILES_SOURCE: ${{ github.workspace }}/dotfiles

    steps:
      - name: Checkout Veyra repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout dotfiles sibling
        uses: actions/checkout@v4
        with:
          repository: Frank1o3/dotfiles
          path: dotfiles
          fetch-depth: 1

      - name: Initialize Arch keyring and install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          # Arch containers need the keyring initialized before pacman can install packages
          pacman-key --init
          pacman-key --populate archlinux

          # Refresh the package database and install build tools
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            archlinux-keyring \
            archiso \
            git \
            rsync \
            sudo \
            pacman-contrib \
            rate-mirrors \
            python \
            curl \
            ca-certificates

          # The build stages CachyOS packages, but this is a plain Arch container.
          # Trust CachyOS's signing key and install only its keyring/mirrorlists;
          # avoid replacing Arch's pacman with CachyOS's custom pacman fork.
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman -U --noconfirm \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-keyring-20240331-1-any.pkg.tar.zst \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-mirrorlist-27-1-any.pkg.tar.zst \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-v3-mirrorlist-27-1-any.pkg.tar.zst \
            https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-v4-mirrorlist-27-1-any.pkg.tar.zst

      - name: Mark workspace as safe for git
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build ISO
        shell: bash
        env:
          DOTFILES_SOURCE: ${{ github.workspace }}/dotfiles
        run: |
          set -euxo pipefail

          echo "Workspace: ${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}"

          test -d "${DOTFILES_SOURCE}"
          test -f "${GITHUB_WORKSPACE}/build.sh"

          cd "${GITHUB_WORKSPACE}"
          ./build.sh

      - name: Locate generated ISO
        shell: bash
        run: |
          set -euxo pipefail

          ISO_PATH="$(find "${GITHUB_WORKSPACE}/out" -type f -name '*.iso' | head -n 1)"
          if [[ -z "${ISO_PATH}" ]]; then
            echo "No ISO found in ${GITHUB_WORKSPACE}/out" >&2
            exit 1
          fi

          cp "${ISO_PATH}" "${GITHUB_WORKSPACE}/VeyraOS.x86_64.iso"
          ls -l "${GITHUB_WORKSPACE}/VeyraOS.x86_64.iso"

      - name: Publish beta release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: VeyraOS beta
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/VeyraOS.x86_64.iso
